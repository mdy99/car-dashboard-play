<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Automotive HMI Template</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #231F20;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/car-dashboard-play.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/car-dashboard-play.data",
        frameworkUrl: "Build/car-dashboard-play.framework.js",
        codeUrl: "Build/car-dashboard-play.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Automotive HMI Template",
        productVersion: "1.4.0",
        devicePixelRatio: window.devicePixelRatio, 
        }).then((unityInstance) => {
          // 유니티 인스턴스를 전역 변수(window)에 할당
          window.unityInstance = unityInstance;
          console.log("Unity Loaded and Assigned to window.unityInstance");
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
